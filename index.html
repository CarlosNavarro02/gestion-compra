<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de la compra</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>🛒 Lista de la compra</h1>

    <form id="form-producto">
      <input id="nombre" type="text" placeholder="Producto (p. ej. leche)" required autocomplete="off">
      <input id="cantidad" type="number" min="1" value="1" aria-label="Cantidad">
      <select id="categoria" aria-label="Categoría">
        <option>Fruta y verdura</option>
        <option>Carne y pescado</option>
        <option>Lácteos</option>
        <option>Despensa</option>
        <option>Limpieza</option>
        <option selected>Otros</option>
      </select>
      <button type="submit">Añadir</button>
    </form>

    <nav class="filtros">
      <button data-filtro="todos" class="activo">Todos</button>
      <button data-filtro="pendientes">Pendientes</button>
      <button data-filtro="comprados">Comprados</button>
    </nav>

    <ul id="lista"></ul>

    <footer>
      <span id="resumen"></span>
      <button id="limpiar">Quitar comprados</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
