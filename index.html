<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14805e">
  <meta name="description" content="Plan semanal de comidas altas en proteína con los precios más baratos de Mercadona.">
  <title>Compra Sana</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥦</text></svg>">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <div>
      <h1>Compra Sana</h1>
      <p id="estado-datos" class="sutil">Cargando precios…</p>
    </div>
  </header>

  <main id="vista" aria-live="polite"></main>

  <nav class="pestanas" aria-label="Secciones">
    <button data-vista="plan" class="activa"><span aria-hidden="true">📅</span>Plan</button>
    <button data-vista="recetas"><span aria-hidden="true">🍳</span>Recetas</button>
    <button data-vista="compra"><span aria-hidden="true">🛒</span>Compra</button>
    <button data-vista="precios"><span aria-hidden="true">🏷️</span>Precios</button>
    <button data-vista="ajustes"><span aria-hidden="true">⚙️</span>Ajustes</button>
  </nav>

  <dialog id="dialogo">
    <div class="dialogo-contenido">
      <button class="cerrar" aria-label="Cerrar" data-cerrar>✕</button>
      <div id="dialogo-cuerpo"></div>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
